[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-gtgenerator"
version = "1.0.0"
description = "GTGenerator GID/text config CLI for the sr-team-skills agent series (Leaps of Civilization)"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.scripts]
gtgenerator = "cli_anything.gtgenerator.gtgenerator_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli_anything*"]
namespaces = true
