id: gdd-result-only-no-process
title: 成稿只留设计结果，不残留证据/拍板/来源/配置契约
description: |
  上游材料刻意带上来源材料清单、E00x 证据编号、T01/C5/D3 拍板编号、假设台账、风险台账、配置契约与未支持声明。
  人类可读版必须把这些过程信息全部剥离，只呈现规则与界面；同时保留 R 组级编号（不得出现 R1.1 式组内小号）、
  每界面 ASCII 线框图 + UE 编号表、数值待定项与验收标准。

input:
  prompt: |
    /sr-gdd-human 材料在当前目录：遗迹勘探_复刻规格_A.md。请出一份给开发团队看的人类可读功能 GDD，
    材料够用就直接出稿，不要再问我取舍。

context:
  files:
    "遗迹勘探_复刻规格_A.md": |
      # 复刻规格：遗迹勘探（Ruins Expedition）

      > 来源材料清单
      >
      > | 编号 | 材料 | 说明 |
      > | --- | --- | --- |
      > | E001 | 竞品录屏《遗迹远征》第 1 段 | 大厅入口与进入动线 |
      > | E002 | 竞品录屏《遗迹远征》第 2 段 | 事件选择与结算 |
      > | E003 | 商店页截图 | 勘探券售卖位 |
      > | E004 | 玩家论坛反馈帖 | 层数上限与挫败感 |
      >
      > 拍板记录：T01 用道具进入、不做体力；T02 层数上限固定、不随次数增长；C5 产出走碎片而非整件遗物；D3 本期不做组队。
      > 配置契约：ruin_ticket_cost（int，进入消耗）、ruin_floor_max（int，层数上限）、ruin_drop_rate（float，冒险翻倍概率）、ruin_unlock_level（int，解锁主城等级）
      > 假设台账：ASM-01 玩家能理解"勘探券"与"行动点"两种资源的分工；ASM-02 结算界面不需要二次确认
      > 风险台账：RK-01 层数上限过低导致挫败；RK-02 掉落概率过低导致无感
      > 未支持声明：本期不支持组队、不支持中途退出保留进度

      ## 1. 玩法一句话

      玩家消耗勘探券从遗迹大厅进入遗迹，逐层推进并在每层做一次事件选择，最终按到达层数结算产出。

      ## 2. 入口与消耗

      - 遗迹大厅设主城常驻入口；主城等级达到门槛后入口解锁，未达门槛时入口可见但置灰，点击提示解锁条件（证据 E001）
      - 每次进入勘探消耗 1 张勘探券；勘探券不足时点击入口只提示获取途径，不进入勘探（拍板 T01）
      - 勘探券来源：日常任务产出、商店购买（证据 E003）

      ## 3. 推进与事件

      - 每次勘探从第一层开始，最多推进到层数上限（拍板 T02）；到达上限即进入结算
      - 每推进一层消耗一点行动点；行动点耗尽时本次勘探立即结束并进入结算
      - 每层固定触发一次事件，事件分三类：资源事件、战斗事件、风险事件
      - 资源事件：点击拾取即获得产出，随后进入下一层
      - 战斗事件：进入战斗，胜利获得产出并推进；失败则本次勘探结束、按已有产出结算（证据 E002）
      - 风险事件：给出稳妥与冒险两个选项；稳妥获得基础产出，冒险有概率翻倍、失败则本次勘探结束
      - 层数越高，单层产出越好（层数加成，倍率待定）

      ## 4. 结算与产出

      - 结算界面展示本次到达层数、产出清单与结束原因（战斗失败、行动点耗尽、冒险失败、主动退出）
      - 产出为遗物碎片与通用资源（拍板 C5）；碎片用于遗迹商店兑换
      - 结算界面的产出在离开结算界面时入库，不需要二次确认（ASM-02）
      - 中途退出不保留进度，退出即按当前产出结算（未支持声明）

      ## 5. 日常与重置

      - 每日重置刷新免费进入次数与行动点
      - 遗迹商店每日刷新一次兑换列表

      ## 6. 界面清单

      - 遗迹大厅：勘探券数量、进入按钮、遗迹商店入口、每日免费次数提示
      - 勘探进行中：层数进度、当前层事件卡、行动点、已获产出、退出按钮
      - 结算：到达层数、产出清单、结束原因、再来一次、返回大厅
      - 通用货币详情弹窗：点击顶部货币图标时由通用组件展示，本功能只保留触发关系
      - 英雄详情页：从结算产出的英雄碎片进入，归属英雄系统

      ## 7. 待定数值

      主城等级门槛、每日免费进入次数、行动点上限、层数上限、冒险翻倍概率、碎片产出量、勘探券单价

judge:
  type: script
  script_path: evals/fixtures/scripts/check_gdd_structure.ps1
  timeout_seconds: 120
