id: gdd-ui-wireframes
title: 界面章——每个界面一张线框图 + UE 编号表，边界界面只做声明
description: |
  材料给了三个自有界面（遗迹大厅、勘探进行中、结算）与两个归属其它系统的界面（通用货币详情弹窗、英雄详情页）。
  按 SKILL.md，每个界面都要有 ASCII 线框图 + 逐条编号的 UE 规则表，并要有界面清单总览、界面流程与全局交互规范；
  通用组件/其它系统界面必须声明"不属于本功能"，只写触发关系，不展开其内部设计（不得给它单独开一节画线框）。

input:
  prompt: |
    /sr-gdd-human 材料在当前目录：遗迹勘探_界面稿_D.md。请出一份给开发团队看的人类可读功能 GDD，
    界面部分要按规范写全，直接出稿。

context:
  files:
    "遗迹勘探_界面稿_D.md": |
      # 设计稿：遗迹勘探（界面稿）

      ## 自有界面

      ### 1 遗迹大厅

      顶部：货币条（金币、钻石，点击货币图标弹出通用货币详情弹窗）
      中部：勘探券数量、每日剩余免费次数、当前活动剩余时间
      底部：进入勘探按钮（勘探券或免费次数不足时置灰）、遗迹商店入口
      边界：活动未开启时整页展示未开启态；主城等级未达门槛时进入按钮置灰并显示解锁条件

      ### 2 勘探进行中

      顶部：当前层数 / 层数上限、行动点、倒计时
      中部：当前层事件卡（资源事件显示拾取按钮；战斗事件显示出战按钮；风险事件显示稳妥与冒险两个选项）
      右侧：已获产出列表
      底部：退出勘探按钮（需二次确认，确认后按当前产出结算）
      边界：倒计时归零按放弃处理；行动点耗尽自动结算

      ### 3 结算

      顶部：本次到达层数
      中部：产出清单（遗物碎片、通用资源）
      底部：再来一次、返回大厅
      边界：产出在离开本界面时入库；离开方式不影响入库结果

      ## 界面流程

      主城 -> 遗迹大厅 -> 勘探进行中 -> （事件循环）-> 结算 -> 遗迹大厅 或 再次进入勘探

      ## 其它系统界面（不在本功能范围内）

      - 通用货币详情弹窗：通用组件，点击任意界面的货币图标触发，内部设计归属通用组件
      - 英雄详情页：点击结算产出的英雄碎片进入，内部设计归属英雄系统

judge:
  type: script
  script_path: evals/fixtures/scripts/check_gdd_ui.ps1
  timeout_seconds: 120
