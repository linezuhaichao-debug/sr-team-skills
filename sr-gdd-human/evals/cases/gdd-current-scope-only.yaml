id: gdd-current-scope-only
title: 只保留当前口径——正文不出现新旧对照与历史表述
description: |
  上游材料是历次口径变更的记录（原方案/旧稿/上版/本次改动/之前）。
  按 SKILL.md，人类可读版正文一律按当前生效规则书写，不保留被取代的旧说法；
  被取代的旧口径如需追溯，只能在文末"已废弃口径（如需追溯）"用一句话列出，不得进正文。

input:
  prompt: |
    /sr-gdd-human 材料在当前目录：遗迹勘探_口径变更_C.md。请出一份给开发团队看的人类可读功能 GDD，直接出稿。

context:
  files:
    "遗迹勘探_口径变更_C.md": |
      # 设计稿：遗迹勘探（含历次口径变更）

      ## 变更记录

      - 原方案每日 3 次免费进入，本次改动后改为每日 5 次免费进入
      - 旧稿写的是 8 层上限，现在调整为 12 层上限且不再随活动天数增长
      - 上版 UI 用竖排列表展示事件选项，现改为横排卡片
      - 之前风险事件失败会清零已获产出，后来改成只扣减一半
      - 变更前勘探券单价为 30 钻石，现调整为 50 钻石
      - 原先冒险失败直接结束勘探，现在改为冒险失败只结束当前事件并留在本层

      ## 当前设计（以本节为准）

      - 遗迹大厅设主城常驻入口，主城等级达到门槛后解锁；未达门槛时入口置灰
      - 每日免费进入次数有限，超出后每次进入消耗一张勘探券
      - 每次勘探从第一层开始，最多推进到层数上限，到达上限即结算
      - 每层消耗一点行动点，行动点耗尽立即结算
      - 每层固定触发一次事件：资源事件、战斗事件、风险事件
      - 资源事件拾取即获得产出；战斗事件胜利推进、失败结束勘探
      - 风险事件给出稳妥与冒险两个选项；稳妥获得基础产出，冒险有概率翻倍
      - 冒险失败只结束当前事件并留在本层，不结束整次勘探；风险事件失败按比例扣减已获产出，不清零
      - 结算界面展示到达层数、产出清单与结束原因；产出在离开结算界面时入库
      - 界面：遗迹大厅、勘探进行中、结算三个界面

judge:
  type: script
  script_path: evals/fixtures/scripts/check_gdd_current_only.ps1
  timeout_seconds: 120
