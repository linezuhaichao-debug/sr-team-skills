id: gdd-no-config-numbers
title: 数值纪律——规则章不得把配置数值当规则
description: |
  上游设计稿给满了配置初值（勘探券单价、免费次数、层数上限、解锁等级、概率、活动天数、ID 号段…）。
  按 SKILL.md 的数值纪律，功能规则章必须写成机制表述 + "参考值 X，待定"，把配置表数字任意改一遍正文应一字不用改。
  本用例断言规则章内不出现这些具体数值，且文末存在数值待定项。

input:
  prompt: |
    /sr-gdd-human 材料在当前目录：遗迹勘探_设计稿_B.md。请出一份给开发团队看的人类可读功能 GDD，直接出稿。

context:
  files:
    "遗迹勘探_设计稿_B.md": |
      # 设计稿：遗迹勘探（带数值初稿）

      以下数值是策划给的初值，正式配表以配置表为准。

      | 配置项 | 初值 | 含义 |
      | --- | --- | --- |
      | ruin_ticket_cost | 50 | 勘探券单价（钻石/张） |
      | ruin_free_times | 3 | 每日免费进入次数 |
      | ruin_floor_max | 12 | 层数上限 |
      | ruin_unlock_level | 15 | 解锁所需主城等级 |
      | ruin_drop_rate | 2.5 | 冒险翻倍概率（%） |
      | ruin_action_point | 5 | 每次勘探行动点 |
      | ruin_event_time | 30 | 每层倒计时（秒） |
      | ruin_duration | 7 | 活动持续（天） |

      遗物碎片 ID 号段为 10001-10099。

      ## 玩法

      玩家消耗勘探券从遗迹大厅进入遗迹，逐层推进，每层做一次事件选择，按到达层数结算产出。

      ## 入口与消耗

      - 主城达到 15 级解锁遗迹大厅入口，未达等级时入口置灰
      - 每日前 3 次进入免费；超出后每次消耗 1 张勘探券
      - 勘探券不足时点击入口只提示获取途径，不进入勘探；勘探券可购买，50 钻石一张

      ## 推进

      - 每次勘探最多推进 12 层，到达上限即结算
      - 行动点上限 5 点，每推进 1 层消耗 1 点，行动点耗尽立即结算
      - 每层 30 秒倒计时，超时按放弃处理并结算

      ## 事件

      - 资源事件：拾取即获得产出
      - 战斗事件：胜利推进，失败结束
      - 风险事件：稳妥获得基础产出；冒险有 2.5% 概率翻倍，失败则本次勘探结束

      ## 活动

      - 活动持续 7 天，每日 5:00 重置免费次数与行动点

      ## 界面

      遗迹大厅、勘探进行中、结算三个界面；界面上要显示剩余免费次数与勘探券数量。

judge:
  type: script
  script_path: evals/fixtures/scripts/check_gdd_numbers.ps1
  timeout_seconds: 120
