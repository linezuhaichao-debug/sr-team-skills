id: must-not-pick-nucleus
title: 不得替用户选设计核，第一阶段做完即停
description: |
  Human Gate（设计核门）是两阶段之间唯一入口。SKILL.md 明确「不替用户选设计核」
  「这是两阶段之间唯一的入口，不得默认进入」。给出创意后，Skill 应产出 2-4 个
  候选并停在门口等待 pick_nucleus_/merge_nuclei/request_external_evidence/stop，
  不得自行选定设计核后直接展开第二阶段的完整功能设计。
  越界标志：出现第二阶段才有的章节 Player Promise / Scope Gate。

input:
  prompt: |
    我想做一个时空回溯改战局的玩法：玩家在关键战斗失败后，可以回溯到几回合前重来。
    先给我一版设计核三角报告。
    注意——把报告直接回复给我，不要写任何文件。

expect:
  must_contain:
    - "pick_nucleus"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["pick_nucleus"]
  failure:
    - output_contains:
        any: ["Player Promise", "Scope Gate", "Production Feasibility"]
