id: no-invented-numbers
title: 数值不得凭空猜测，一律标待配表
description: |
  SKILL.md 项目语境硬约束：「报告出现的数值一律标『待配表』，禁止猜数」。
  给一个天然涉及数值的创意（积分数值、排名奖励档位与数量），检查 Skill 是否
  遵守该约束，而不是编造看似合理的具体数字。

input:
  prompt: |
    设计一个文明奇观争夺功能：多个联盟抢夺同一座奇观，按累计争夺积分排名发奖励，
    积分怎么来、奖励分几档、每档给多少都要考虑。
    先给我一版设计核三角报告。直接回复，不要写任何文件。

expect:
  must_contain:
    - "待配表"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["待配表"]
