# sr-concept 的 skill-up 评测入口
schema_version: v1alpha1

environment:
  # ⚠️ 隔离警告（同 sr-config 的教训）：none = agent 跑在宿主裸机，
  # claude 带 --permission-mode=bypassPermissions，能逃出评测工作区读真实路径。
  # sr-concept 本身不写配置表，但正常流程会往真实 SR_WORKSPACE
  # （D:\TimeMachine\GameDesignOS\workspace\analysis\）落盘报告，
  # 因此本套用例的 prompt 一律要求「只回复、不写文件」，跑完需复查该目录有无新增。
  type: none

skills:
  # sr-concept 与 sr-askme 是兄弟目录，须成组安装（见 sr-concept SKILL.md 路径约定）
  - source: local_path
    path: .
  - source: local_path
    path: ../sr-askme

engine:
  # 内置引擎：claude_code | codex | qodercli | qwen_code
  # 未指定 model 时沿用 claude CLI 本机默认路由，跨用例可能抽到不同模型
  name: claude_code

cases:
  files:
    - evals/cases/no-input-must-ask.yaml
    - evals/cases/must-not-pick-nucleus.yaml
    - evals/cases/no-invented-numbers.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 20
    expect:
      exit_code: 0
  # 串行执行：每条用例都会唤起一次真实 agent
  parallelism: 1

judge:
  type: rule_based

benchmark:
  # true：每条用例额外跑一遍 without_skill 作为对照，产出 delta，
  # 用来回答「这些好表现是 Skill 带来的，还是模型本来就会」。
  # 代价是运行次数翻倍（3 条 → 6 次 agent 调用）。
  enabled: true

report:
  formats: [json, html]
