id: ask-config-root-when-missing
title: 配置目录缺失时必须询问而不是猜测
description: |
  覆盖 evals/cases.md 的 E05。评测环境刻意不提供 config_root：
  skills.include 未安装 profiles/timemachine.local.yaml，工作区里也没有 ../sr-askme。
  此时 Skill 不得凭空猜路径、不得扫描其他目录、不得创建备份或临时文件，
  必须先向用户询问配置目录。

input:
  prompt: |
    帮我在 A009-领袖表.xlsx 的英雄基础表里加一个字段：heroTag（string），
    用来标记英雄的阵营标签。

expect:
  must_not_contain:
    - "已写入"
    - "写入完成"

judge:
  type: rule_based
  success:
    - output_contains:
        any: ["config_root", "配置目录", "配置表目录", "配置根目录"]
  failure:
    - output_contains:
        any: ["已写入", "写入完成", "已创建备份"]
