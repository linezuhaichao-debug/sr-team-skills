id: weight-pattern-not-merged
title: 权重语义不得跨模式混用
description: |
  覆盖 evals/cases.md 的 E10。单个整数字段（baseweight）属于已验证的 weight_scalar；
  成对出现的条目 ID + 权重属于另一种语义，不能因为名字里都有「权重」就合并，
  也不能把权重值解释为百分比。

input:
  prompt: |
    我在设计一张新表，有两个字段拿不准该用哪个已验证模式：
    1. baseweight，单个整数字段，表示招募池里某个英雄的抽取权重
    2. entry_gid,weight，一行里成对出现的条目 ID 和权重值
    请分别判断它们匹配哪个已验证模式，并说明这两个需求能不能当成同一种模式复用。
    只输出分析结论，不要修改任何文件。

expect:
  must_contain:
    - "weight_scalar"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["weight_scalar"]
    - output_contains:
        any: ["候选", "candidate", "没有已验证", "不存在已验证", "未经验证", "需新建"]
