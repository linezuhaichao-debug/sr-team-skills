# sr-config 的 skill-up 评测入口
schema_version: v1alpha1

environment:
  # ⚠️ 隔离警告（2026-09-16 实测）：none = agent 跑在宿主裸机，claude 又带
  # --permission-mode=bypassPermissions，实测它能逃出评测工作区去读
  # ../sr-askme/config.local.json、解析出真实 config_root，并全盘搜索 D:/E:/C:。
  # 本机未装 docker，opensandbox 也无服务，因此目前没有可用的真隔离。
  # 在补齐隔离之前，只跑不需要文件证据的用例；任何可能触发写入的用例都不要跑。
  type: none

skills:
  - source: local_path
    path: .
    # 刻意不安装 profiles/timemachine.local.yaml：
    # 该文件含本机私有路径，而它的缺席正是 ask-config-root-when-missing 用例的前提
    include:
      - SKILL.md
      - "references/**"
      - "tools/**"
      - "profiles/timemachine.md"
      - "profiles/timemachine.local.example.yaml"

engine:
  # 内置引擎：claude_code | codex | qodercli | qwen_code
  name: claude_code

cases:
  files:
    - evals/cases/ask-config-root-when-missing.yaml
    - evals/cases/weight-pattern-not-merged.yaml
    - evals/cases/no-write-without-approval.yaml
  defaults:
    timeout_seconds: 600
    max_turns: 15
    # 三条用例都只要求分析结论，命令本身应正常退出
    expect:
      exit_code: 0
  # 串行执行：每条用例都会唤起一次真实 agent，避免并发叠加消耗
  parallelism: 1

judge:
  type: rule_based

benchmark:
  enabled: false

report:
  formats: [json, html]
